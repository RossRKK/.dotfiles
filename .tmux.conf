# Mouse support
set -g mouse on

# Better colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Increase scrollback buffer
set -g history-limit 10000

# vi-style copy mode (hjkl to move, v to select, y to copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Pipe the selection to every local clipboard (Windows + Linux) via the
# clipboard-copy script. OSC 52 (set-clipboard, below) is unreliable here because
# tmux runs inside nvim's :terminal, which drops all but the first line — but it
# stays on as a fallback for remote/plain terminals without local clipboard tools.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clipboard-copy"
# i / a leave copy mode back to the live terminal (like exiting to insert)
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi a send -X cancel

# Send copies to the system clipboard via OSC 52 (portable: works in
# Alacritty, Windows Terminal, etc. without wl-copy/xclip/clip.exe)
set -g set-clipboard on

# Mouse drag just selects — no copy, no snap to bottom.
# Selection stays highlighted so you can yank it with `y` when ready.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# Faster key repetition
set -s escape-time 0

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Default shell
run-shell 'tmux set-option -g default-shell "$(command -v fish)"'

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-style 'bg=#1a1b26 fg=#c0caf5'
set -g status-left ' #S '
set -g status-left-style 'bg=#7aa2f7 fg=#1a1b26 bold'
set -g status-right ' %H:%M '
set -g status-right-style 'bg=#1a1b26 fg=#565f89'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'bg=#2ac3de fg=#1a1b26 bold'
