[preview]
# Open the preview pane on startup instead of waiting for `p`.
show_at_start = true
# position         = "auto"  # auto | right | bottom
# width_percentage = 50.0

# shift+o: open the pull request for the selected revision's bookmark, like
# lazygit's `o` on a branch. Acts only on a revision that carries a bookmark
# (no ancestor search). Opens the existing PR, else the prefilled compare page.
[[actions]]
name = "pr.open"
key = "shift+o"
scope = "revisions"
desc = "open PR"
lua = """
local id = context.change_id()
if not id then return end
local out, err = jj("log", "--no-graph", "-r", id, "-T",
  'bookmarks.map(|b| b.name()).join("\\\\n")')
if err then flash({ text = err, error = true }); return end
local names = split_lines(out or "")
if #names == 0 then
  flash({ text = "no bookmark on " .. id, error = true })
  return
end
local b = names[1]
if #names > 1 then
  b = choose({ options = names, title = "open PR for bookmark" })
  if not b then return end
end
exec_shell("gh pr view --web --head '" .. b .. "' 2>/dev/null || gh pr create --web --head '" .. b .. "'")
"""

# w: open the selected revision's bookmark as a jj workspace project tab in the
# surrounding nvim (util/jjworkspace.lua), like lazygit's `w` on a branch.
# Bookmark-only, like pr.open. No-op outside nvim, where $NVIM is unset.
[[actions]]
name = "workspace.open"
key = "w"
scope = "revisions"
desc = "open workspace tab"
lua = """
local id = context.change_id()
if not id then return end
local out, err = jj("log", "--no-graph", "-r", id, "-T",
  'bookmarks.map(|b| b.name()).join("\\\\n")')
if err then flash({ text = err, error = true }); return end
local names = split_lines(out or "")
if #names == 0 then
  flash({ text = "no bookmark on " .. id, error = true })
  return
end
local b = names[1]
if #names > 1 then
  b = choose({ options = names, title = "open workspace for bookmark" })
  if not b then return end
end
if os.getenv("NVIM") == nil then
  flash({ text = "not inside nvim", error = true })
  return
end
exec_shell("nvim --server \\"$NVIM\\" --remote-expr \\"v:lua.require'util.jjworkspace'.open_from_jjui('" .. b .. "')\\"")
"""

# shift+b: the built-in set-bookmark prompt, prefilled like lazygit's `n`:
# `rkk/` plus the selected revision's bookmark name with any `<prefix>/`
# dropped; trunk names (main/master/develop/trunk) contribute nothing. The
# first bookmark that yields a non-empty suffix wins. Always editable.
[[actions]]
name = "bookmark.set_rkk"
key = "shift+b"
scope = "revisions"
desc = "set bookmark (rkk/)"
lua = """
local id = context.change_id()
if not id then return end
local out, err = jj("log", "--no-graph", "-r", id, "-T",
  'bookmarks.map(|b| b.name()).join("\\\\n")')
if err then flash({ text = err, error = true }); return end
local suffix = ""
for _, name in ipairs(split_lines(out or "")) do
  local s = name:gsub("^[^/]+/", "")
  if s == "main" or s == "master" or s == "develop" or s == "trunk" then s = "" end
  if s ~= "" then suffix = s; break end
end
jjui.revisions.open_set_bookmark({ value = "rkk/" .. suffix })
"""

# shift+f: fetch every remote, like lazygit's `f`. One key instead of the git
# menu's `g` then `f`. Tracked bookmarks (master, main) follow the remote, which
# is what keeps the "<repo> - <branch>" tab title and the greeter current.
[[actions]]
name = "git.fetch"
key = "shift+f"
scope = "revisions"
desc = "git fetch"
lua = """
local _, err = jj("git", "fetch")
if err then flash({ text = err, error = true }); return end
flash({ text = "fetched" })
"""
