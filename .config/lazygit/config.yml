quitOnTopLevelReturn: false
customCommands:
  - key: "n"
    context: "localBranches"
    description: "New branch off the selected branch, replacing its prefix with rkk/"
    prompts:
      - type: "input"
        title: "Branch name"
        key: "Name"
        initialValue: >-
          rkk/{{ runCommand (printf "sh -c %s" (printf "echo %s | sed -E -e 's#^(main|master|develop|trunk)$##' -e 's#^[^/]+/##'" .SelectedLocalBranch.Name | quote)) }}
    # Start point is the selected branch (like lazygit's built-in n), not HEAD.
    command: >-
      git checkout -b "{{.Form.Name}}" "{{.SelectedLocalBranch.Name}}"
    loadingText: "Creating branch..."
  - key: "n"
    context: "worktrees"
    description: "New worktree in ~ (branch rkk/<name>)"
    prompts:
      - type: "input"
        title: "Worktree name (created at ~/<name>, branch rkk/<name>)"
        key: "Name"
    command: >-
      git worktree add ~/"{{.Form.Name}}" -b "rkk/{{.Form.Name}}"
    loadingText: "Creating worktree..."
  # Open the selected branch as a worktree project tab in the surrounding nvim
  # (util/worktree.lua). No-op outside nvim, where $NVIM is unset.
  - key: "w"
    context: "localBranches"
    description: "Open branch as a worktree project tab (nvim)"
    command: >-
      [ -n "$NVIM" ] && nvim --server "$NVIM" --remote-expr
      "v:lua.require'util.worktree'.open_from_lazygit('{{.SelectedLocalBranch.Name}}')"
    loadingText: "Opening worktree tab..."
  - key: "w"
    context: "remoteBranches"
    description: "Open branch as a worktree project tab (nvim)"
    command: >-
      [ -n "$NVIM" ] && nvim --server "$NVIM" --remote-expr
      "v:lua.require'util.worktree'.open_from_lazygit('{{.SelectedRemoteBranch.RemoteName}}/{{.SelectedRemoteBranch.Name}}')"
    loadingText: "Opening worktree tab..."
  - key: "p"
    context: "commits"
    description: "Export selected commit(s) to a single squashed patch"
    prompts:
      - type: "input"
        title: "Output patch file"
        initialValue: "changes.patch"
    command: >-
      git diff {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}} > {{index .PromptResponses 0}}
    loadingText: "Creating patch..."
    output: popup
